x-test-env: &test-env
  DATABASE_URL: postgresql://aigc:e2e-postgres@postgres:5432/aigc_marketplace?schema=public
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: e2e-session-secret-not-for-production
  SMS_HASH_SECRET: e2e-sms-hash-secret-not-for-production
  NEXT_PUBLIC_APP_URL: http://localhost:18123
  DEMO_PASSWORD: e2e-only-password
  APP_ENV: test
  SMS_PROVIDER: memory
  FILE_PROVIDER: memory
  E2E_TEST_SECRET: e2e-browser-secret
  SMS_CODE_TTL_SECONDS: "10"

services:
  web:
    build: .
    environment: *test-env
    ports:
      - "127.0.0.1:18123:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  migrate:
    build:
      context: .
      target: builder
    environment: *test-env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
  seed:
    build:
      context: .
      target: builder
    environment: *test-env
    command: ["npx", "prisma", "db", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aigc_marketplace
      POSTGRES_USER: aigc
      POSTGRES_PASSWORD: e2e-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigc -d aigc_marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
